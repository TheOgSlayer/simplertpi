name: SimpleRTP
version: '1.0.0'
main: dev.rtp.RtpPlugin
api-version: '26.2'
depend: [Vault]
commands:
  rtp:
    description: Randomly teleport
    usage: /rtp [overworld|nether|end]
    aliases: [randomtp, wild]
permissions:
  rtp.use:
    default: true
  rtp.world.overworld:
    default: true
  rtp.world.nether:
    default: true
  rtp.world.end:
    default: true
  rtp.bypass.cooldown:
    default: op
  rtp.bypass.cost:
    default: op
  rtp.reload:
    default: op
