# One cooldown shared by all destinations (seconds)
cooldown-seconds: 300

# Cost per teleport. Charged only after a successful teleport.
cost: 100.0

gui:
  title: "<dark_gray>Random Teleport"
  filler: GRAY_STAINED_GLASS_PANE   # set to AIR to disable
  lore:
    - "<!italic><gray>Range: <white><min>-<max> blocks"
    - "<!italic><gray>Cost: <yellow><cost>"
    - "<!italic><gray>Cooldown: <white><cooldown>"
    - ""
    - "<!italic><green>Click to teleport!"

# Each destination: the world is found by environment (NORMAL, NETHER, THE_END).
# Set "world" to an exact world name to override.
# Radius is measured from the world border center.
destinations:
  overworld:
    enabled: true
    environment: NORMAL
    world: ""
    display-name: "<green>Overworld"
    icon: GRASS_BLOCK
    slot: 11
    min-radius: 500
    max-radius: 5000
  nether:
    enabled: true
    environment: NETHER
    world: ""
    display-name: "<red>Nether"
    icon: NETHERRACK
    slot: 13
    min-radius: 100
    max-radius: 1000
  end:
    enabled: true
    environment: THE_END
    world: ""
    display-name: "<light_purple>The End"
    icon: END_STONE
    slot: 15
    min-radius: 0
    max-radius: 60

messages:
  player-only: "Only players can use this command."
  no-permission: "You don't have permission."
  world-no-permission: "You don't have permission to teleport there."
  unavailable: "That destination isn't available."
  cooldown: "Wait <time> before using /rtp again."
  not-enough-money: "You need <cost> to use /rtp."
  already-pending: "Teleport already in progress."
  teleporting: "Teleporting..."
  success: "Teleported to <world>! (Charged <cost>)"
  failed: "Teleport failed. You were not charged."
  reloaded: "SimpleRTP config reloaded."
